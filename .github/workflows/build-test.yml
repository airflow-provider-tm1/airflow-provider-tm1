name: Build & test Airflow
env:
  NAME: 'Snyk Demo'
on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main", "feature/*" ]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    
  workflow_dispatch:
  
jobs:

  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test') && github.event.pull_request.head.repo.fork)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) 
      || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "2.11"
            base-image: "apache/airflow:2.11.0-python3.11"
            display-name: "Airflow 2.11"
          - airflow-version: "3.0"
            base-image: "apache/airflow:3.0.6-python3.11"
            display-name: "Airflow 3.0"
    name: Build & test (${{ matrix.display-name }})
    
    steps:
    - name: Checkout Code for fork PR
      if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test')
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Checkout Code for fork PR
      if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test')
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Checkout Code for Push or local PR
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Configure Docker for private registry
      env:
        TM1_REGISTRY: ${{ vars.TM1_REGISTRY }}
      run: |
        # The TM1 test image is served from a private HTTP registry on the tailnet.
        # Trust it as an insecure registry so docker compose can pull over plain HTTP.
        REGISTRY="${TM1_REGISTRY:-100.109.186.25:5100}"
        REGISTRY_HOST="${REGISTRY%%:*}"
        echo "Registry: ${REGISTRY} (host: ${REGISTRY_HOST})"

        # Confirm the runner is on the tailnet and can reach the registry host
        # before pulling. These are non-fatal diagnostics.
        sudo tailscale ping "${REGISTRY_HOST}" || true

        sudo mkdir -p /etc/docker
        echo "{\"insecure-registries\": [\"${REGISTRY}\"]}" | sudo tee /etc/docker/daemon.json
        sudo systemctl daemon-reload
        sudo systemctl restart docker

        # Verify the registry is reachable before pulling images.
        curl -fsS "http://${REGISTRY}/v2/_catalog"

    - name: Install & Run Airflow
      env:
        AIRFLOW_BASE_IMAGE: ${{ matrix.base-image }}
      run: |
        PYPACKAGE=$(ls dist | grep .whl)
        cd tests_integration
        echo -e "AIRFLOW_UID=$(id -u)" > .env
        echo -e "AIRFLOW_BASE_IMAGE=${AIRFLOW_BASE_IMAGE}" >> .env
        docker compose up -d airflow-init
        docker compose up -d --build
    
    - name: Add TM1 connection to Airflow
      run: |
        DOCKID=$(docker ps -q --filter "name=tests_integration-airflow-worker-1")
        TM1_CONN=$(docker exec $DOCKID airflow connections list | grep tm1_conn) || true
        if [ -z "$TM1_CONN" ]; then
          docker exec $DOCKID airflow connections add 'tm1_conn' --conn-json '{"conn_type": "tm1", "host": "tm1", "login": "admin", "schema": "", "port": 5360, "extra": {"ssl": "False"}}'
        else
          echo "Connection already added: $TM1_CONN"
        fi

    - name: Test Airflow TM1 provider
      run: |
        cd tests_integration
        echo "Running tests..."
        pip install pytest
        pytest integration_test.py -s

    - name: Archive production artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-logs-airflow-${{ matrix.airflow-version }}
        path: |
          tests_integration/logs/*
          tests_integration/tm1models/24Retail/tm1server.log
          tests_integration/tm1models/24Retail/tm1processerror*.log
    
    - name: Stop docker containers
      if: always()
      run: |
        cd tests_integration
        docker compose down
